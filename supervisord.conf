[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=docker-php-entrypoint php-fpm
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stopwaitsecs=3600

; No system crontab exists anywhere in this repo to drive routes/console.php's
; Schedule::command(...) entries (abandoned carts, ES reindex, sitemaps, CRM
; sync-adjacent jobs, etc.) — whatever triggers them on the real server lives
; outside version control (most likely a host crontab running `docker exec ...
; artisan schedule:run` every minute). `schedule:work` is Laravel's own
; foreground scheduler loop, built for exactly this containerized case — it
; checks every minute internally, no external cron needed.
[program:scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stopwaitsecs=60
